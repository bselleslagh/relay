name: Relay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELAY_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Relay/Info.plist
        CODE_SIGN_ENTITLEMENTS: Relay/Relay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
  RelayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelayTests]
    dependencies:
      - target: Relay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RelayUITests]
    dependencies:
      - target: Relay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relay:
    build:
      targets:
        Relay: all
        RelayTests: [test]
        RelayUITests: [test]
    test:
      targets: [RelayTests, RelayUITests]
      gatherCoverageData: true
