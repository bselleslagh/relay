[project]
name = "relay-hub"
version = "0.1.0"
description = "Self-hosted companion for the Relay iPhone app: an MCP endpoint and queue for Apple Health writes, plus nutrition sync."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastmcp>=3.4,<4",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
relay-hub = "relay_hub.cli:main"

[dependency-groups]
dev = [
    # Starlette's TestClient transport. Pinned to an established release.
    "httpx2==2.13.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:relay_hub.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "ASYNC", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
